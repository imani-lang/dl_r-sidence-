<!-- ===================== MODALE LOGO ===================== -->
<div class="modal-overlay" id="logoModal">
  <div class="modal-box">
    <button class="modal-close" data-close-modal>&times;</button>
    <img src="DL.png" alt="Logo DL RESID OX" class="modal-logo">
    <div class="modal-name">DL RESID OX</div>
    <div class="modal-loc">Hydra, Alger — Algérie</div>
    <div class="modal-phone">&#9742; +213 XX XX XX XX</div>
    <button class="btn btn-navy btn-block" id="showMapBtn">Voir sur la carte</button>
  </div>
</div>

<!-- ===================== MODALE CARTE ===================== -->
<div class="modal-overlay" id="mapModal">
  <div class="modal-box">
    <button class="modal-close" data-close-modal>&times;</button>
    <h3>Localisation — DL RESID OX, Hydra</h3>
    <iframe src="https://maps.google.com/maps?q=Hydra%2C%20Alger%2C%20Alg%C3%A9rie&t=&z=15&ie=UTF8&iwloc=&output=embed" allowfullscreen loading="lazy"></iframe>
  </div>
</div>

<!-- ===================== FORMULAIRE ===================== -->
<section style="padding:70px 0;">
  <div class="container">
    <div class="form-shell">
      <div class="tabs">
        <button class="tab-btn active" id="tabLogin">Connexion</button>
        <button class="tab-btn" id="tabSignup">Créer un compte</button>
      </div>

      <!-- ----- Connexion ----- -->
      <div class="form-panel active" id="panelLogin">
        <div class="form-msg" id="loginMsg"></div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="loginEmail">Adresse email</label>
            <input type="email" id="loginEmail" placeholder="exemple@mail.com" required>
            <div class="field-error" id="loginEmailErr"></div>
          </div>
          <div class="field">
            <label for="loginPwd">Mot de passe</label>
            <input type="password" id="loginPwd" placeholder="••••••••" required>
            <div class="field-error" id="loginPwdErr"></div>
            <div class="field-hint">Plus de 6 caractères.</div>
          </div>
          <button type="submit" class="btn btn-gold btn-block">Se connecter</button>
        </form>
      </div>

      <!-- ----- Inscription ----- -->
      <div class="form-panel" id="panelSignup">
        <div class="form-msg" id="signupMsg"></div>
        <form id="signupForm" novalidate>
          <div class="field">
            <label for="signupNom">Nom complet</label>
            <input type="text" id="signupNom" placeholder="Votre nom" required>
            <div class="field-error" id="signupNomErr"></div>
          </div>
          <div class="field">
            <label for="signupEmail">Adresse email</label>
            <input type="email" id="signupEmail" placeholder="exemple@mail.com" required>
            <div class="field-error" id="signupEmailErr"></div>
            <div class="field-hint">Doit contenir "@".</div>
          </div>
          <div class="field">
            <label for="signupPwd">Mot de passe</label>
            <input type="password" id="signupPwd" placeholder="••••••••" required>
            <div class="field-error" id="signupPwdErr"></div>
            <div class="field-hint">Plus de 6 caractères.</div>
          </div>
          <div class="field">
            <label for="signupPwd2">Confirmer le mot de passe</label>
            <input type="password" id="signupPwd2" placeholder="••••••••" required>
            <div class="field-error" id="signupPwd2Err"></div>
          </div>
          <button type="submit" class="btn btn-gold btn-block">Créer mon compte</button>
        </form>
      </div>
    </div>
  </div>
</section>
